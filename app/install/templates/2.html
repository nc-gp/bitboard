<section class="installer-view">
    <p class="installer-kicker">Requirements</p>
    <h1>Check the server.</h1>
    <p class="installer-lede">
        BitBoard needs PHP 8.0 or newer and the MySQLi extension. These checks run automatically.
    </p>

    <div class="installer-requirements">
        {php}
        {mysql}
    </div>

    {error}

    <form id="bb-form" action="" method="post">
        <input type="hidden" name="step" value="2">
        <input type="hidden" name="csrf_token" value="{csrf}">

        <div class="installer-actions">
            <button type="submit" class="button">Continue</button>
        </div>
    </form>
</section>
