<section class="installer-view">
    <p class="installer-kicker">Database</p>
    <h1>Connect your database.</h1>
    <p class="installer-lede">
        Use an existing MySQL database or let BitBoard create one with these credentials.
        The account needs permission to create tables and indexes.
    </p>

    <form id="bb-form" action="" method="POST" novalidate autocomplete="off">
        <input type="hidden" name="step" value="3">
        <input type="hidden" name="csrf_token" value="{csrf}">

        <div class="installer-fields">
            <label class="installer-field" for="db-host">
                <span>Database host</span>
                <input id="db-host" special name="host" type="text" required
                    placeholder="localhost" autocomplete="off" aria-describedby="db-host-hint">
                <small id="db-host-hint">Usually <code>localhost</code>. Ask your host if unsure.</small>
            </label>

            <label class="installer-field" for="db-user">
                <span>Database user</span>
                <input id="db-user" special name="username" type="text" required
                    autocomplete="off" aria-describedby="db-user-hint">
                <small id="db-user-hint">The MySQL account BitBoard should use.</small>
            </label>

            <label class="installer-field" for="db-password">
                <span>Database password</span>
                <input id="db-password" name="password" type="password" required
                    autocomplete="new-password" aria-describedby="db-password-hint">
                <small id="db-password-hint">Leave blank only if your database user has no password.</small>
            </label>

            <label class="installer-field" for="db-name">
                <span>Database name</span>
                <input id="db-name" special name="name" type="text" value="bitboard" required
                    autocomplete="off" aria-describedby="db-name-hint">
                <small id="db-name-hint">Letters, numbers, and underscores only. Created if it does not exist.</small>
            </label>
        </div>

        <p class="installer-note">
            These credentials are written to <code>app/config.php</code>. Keep that file private.
        </p>

        {error}

        <div class="installer-actions">
            <button type="submit" class="button">Test connection</button>
        </div>
    </form>
</section>
