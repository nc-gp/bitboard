<section class="installer-view">
    <p class="installer-kicker">Forum</p>
    <h1>Name your forum.</h1>
    <p class="installer-lede">
        These settings appear in the browser title, header, and metadata. You can change them
        later from the admin panel.
    </p>

    <form id="bb-form" action="" method="POST" novalidate autocomplete="off">
        <input type="hidden" name="step" value="5">
        <input type="hidden" name="csrf_token" value="{csrf}">

        <div class="installer-fields">
            <label class="installer-field" for="forum-name">
                <span>Forum name</span>
                <input id="forum-name" cmin="2" special name="name" type="text" required
                    maxlength="64" aria-describedby="forum-name-hint">
                <small id="forum-name-hint">Shown in the browser title and site header.</small>
            </label>

            <label class="installer-field" for="forum-description">
                <span>Forum description</span>
                <input id="forum-description" cmin="2" special name="description" type="text" required
                    maxlength="256" aria-describedby="forum-description-hint">
                <small id="forum-description-hint">A short summary used on the index page and in metadata.</small>
            </label>

            <label class="installer-field" for="admin-path">
                <span>Admin panel path</span>
                <input id="admin-path" cmin="3" special name="admin_path" type="text" value="admin"
                    maxlength="64" required reg="^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$"
                    autocomplete="off" aria-describedby="admin-path-hint">
                <small id="admin-path-hint">
                    Your admin panel will live at <code>/admin</code>. Pick a less obvious path
                    before going public.
                </small>
            </label>
        </div>

        {error}

        <div class="installer-actions">
            <button type="submit" class="button">Save forum settings</button>
        </div>
    </form>
</section>
