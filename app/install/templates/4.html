<section class="installer-view">
    <p class="installer-kicker">Administrator</p>
    <h1>Create your administrator.</h1>
    <p class="installer-lede">
        This account gets the Admin rank and full access to the forum and admin panel.
        You can create more accounts later.
    </p>

    <form id="bb-form" action="" method="POST" novalidate autocomplete="off">
        <input type="hidden" name="step" value="4">
        <input type="hidden" name="csrf_token" value="{csrf}">

        <div class="installer-fields">
            <label class="installer-field" for="admin-username">
                <span>Username</span>
                <input id="admin-username" cmin="4" special name="username" type="text" required
                    maxlength="32" autocomplete="username" aria-describedby="admin-username-hint">
                <small id="admin-username-hint">At least 4 characters. This is your public display name.</small>
            </label>

            <label class="installer-field" for="admin-email">
                <span>Email</span>
                <input id="admin-email" special name="email" type="email" required
                    maxlength="64" autocomplete="email" reg="[^@]+@[^@]+\.[a-zA-Z]{2,}"
                    aria-describedby="admin-email-hint">
                <small id="admin-email-hint">Used for sign-in and account recovery later.</small>
            </label>

            <label class="installer-field" for="admin-password">
                <span>Password</span>
                <input id="admin-password" cmin="8" special name="password" type="password" required
                    minlength="8" autocomplete="new-password"
                    reg="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,}$"
                    aria-describedby="admin-password-hint">
                <small id="admin-password-hint">
                    At least 8 characters with a number, an uppercase letter, and a lowercase letter.
                </small>
            </label>
        </div>

        {error}

        <div class="installer-actions">
            <button type="submit" class="button">Create administrator</button>
        </div>
    </form>
</section>
