<!doctype html>
<html>
{head}
<body>
	<div class="bit-container">
		{header}

		<div id="content">
			<section id="post-form">
				<header>
					<h1>{heading}</h1>
					<p>{subheading}</p>
				</header>

				{error}

				<form action="{server_url}post" method="post">
					<input type="hidden" name="csrf_token" value="{csrf_token}">
					{context_fields}

					{title_field}
					{prefix_field}

					<label for="post-content">Message</label>
					<div class="bb-editor" data-editor data-draft-key="{draft_key}" data-preview-url="{server_url}preview">
						{editor_toolbar}
						<textarea id="post-content" name="content" maxlength="4000" required>{content}</textarea>
					</div>
					<p class="post-hint">
						Markdown is supported: <strong>**bold**</strong>, <em>*italic*</em>, <code>`code`</code>,
						<code>&gt;</code> quotes, lists, links, and images. Raw HTML is shown as text.
						Use <code>@username</code> to mention a member.
					</p>

					<div class="post-actions">
						<button type="submit">{submit_label}</button>
						<a href="{cancel_url}" class="post-cancel">Cancel</a>
					</div>
				</form>
			</section>
		</div>

		{footer}
	</div>
	<script src="{server_url}assets/javascripts/editor.js"></script>
	{scripts}
</body>
</html>
