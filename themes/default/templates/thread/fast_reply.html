<section id="fast-reply">
    <div class="fast-reply-header">
        <h2><i class="ti ti-message-plus" aria-hidden="true"></i> Fast reply</h2>
        <span>{hint}</span>
    </div>

    <form id="fast-reply-form" action="{server_url}post" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{csrf_token}">
        <input type="hidden" name="thread" value="{thread_id}">
        <input type="hidden" name="page" value="{return_page}">

        <div class="bb-editor" data-editor data-draft-key="{draft_key}" data-preview-url="{server_url}preview">
            {editor_toolbar}
            <textarea id="fast-reply-content" name="content" maxlength="4000" required
                aria-label="Reply message" placeholder="Write a reply..."></textarea>
        </div>

        <div class="fast-reply-quote-bar" hidden>
            <span class="fast-reply-quote-count">0 posts selected</span>
            <button type="button" class="quote-selected">Quote selected</button>
            <button type="button" class="quote-clear">Clear</button>
        </div>

        {attachments_field}

        <div class="fast-reply-actions">
            <button type="submit">Post reply</button>
        </div>
    </form>
</section>
