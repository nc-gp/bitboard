<!DOCTYPE html>
<html lang="en">
{head}
<body>
	<div class="bit-container">
		{header}

		<div id="content" role="main" style="display: block">
            <div id="thread" data-thread-id="{thread_id}">
                {thread}
            </div>
            {viewing}
            <div id="posts">
                {posts}
            </div>
            <div id="thread-reply-area">
                {reply_area}
            </div>
            {pagination}
		</div>

        {footer}
	</div>
	<script src="{server_url}assets/javascripts/quotes.js"></script>
	<script src="{server_url}assets/javascripts/reactions.js"></script>
	<script src="{server_url}assets/javascripts/fast-reply.js"></script>
	<script src="{server_url}assets/javascripts/editor.js"></script>
	{scripts}
</body>
</html>
