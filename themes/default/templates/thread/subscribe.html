<form class="thread-subscribe-form" action="{server_url}subscribe" method="post">
    <input type="hidden" name="csrf_token" value="{csrf_token}">
    <input type="hidden" name="thread" value="{thread_id}">
    <input type="hidden" name="page" value="{page}">
    <input type="hidden" name="action" value="{action}">
    <button type="submit" class="content-subscribe-link{state_class}">
        <i class="ti {icon}" aria-hidden="true"></i> {label}
    </button>
</form>
