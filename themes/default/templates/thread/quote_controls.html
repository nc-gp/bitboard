<a class="content-quote-link" href="{quote_url}" data-quote-text="{quote_text}" aria-label="Quote this post">
    <i class="ti ti-quote" aria-hidden="true"></i> Quote
</a>
<button type="button" class="content-multiquote-link" data-quote-key="{quote_key}" data-quote-text="{quote_text}" aria-pressed="false" aria-label="Add this post to a multi-quote" data-tooltip-position="top" role="tooltip">
    <i class="ti ti-plus" aria-hidden="true"></i>
</button>
