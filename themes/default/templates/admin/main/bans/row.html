<tr class="admin-ban-row is-{status_class}">
    <td><a href="{profile_url}">{user_name}</a></td>
    <td class="admin-ban-reason-cell">{reason}</td>
    <td>
        {issued_at}
        <span class="admin-ban-meta">by {issuer}</span>
    </td>
    <td>{expires_at}</td>
    <td>
        <span class="admin-ban-badge is-{status_class}">{status_label}</span>
        {status_meta}
    </td>
    <td>{action}</td>
</tr>
