<article class="admin-prefixes">
    <header class="admin-section-header">
        <span class="admin-section-icon"><i class="ti ti-tag" aria-hidden="true"></i></span>
        <div>
            <h2>Prefixes</h2>
            <p>Custom thread tags shown in listings and on thread pages.</p>
        </div>
    </header>

    <form id="prefixCreateForm" class="admin-category-create" method="post" action="{server_url}api/prefixes">
        <input type="hidden" name="csrf_token" value="{csrf_token}">

        <div class="admin-category-fields">
            <label>
                <span>Name</span>
                <input type="text" name="prefixname" maxlength="64" placeholder="Question" required>
            </label>
            <label>
                <span>CSS class</span>
                <input type="text" name="prefixclass" maxlength="64" placeholder="prquestion" pattern="[A-Za-z0-9_-]+" required>
            </label>
        </div>

        <p class="admin-field-hint">The CSS class is applied to the prefix badge. Define matching styles in the active theme.</p>

        <div class="admin-category-actions">
            <button type="submit">Create prefix</button>
        </div>
    </form>

    <div id="preprefixes">
        {prefixes}
    </div>
</article>

<script>
    const closeEmbed = () => {
        const embedder = document.querySelector('embedder');
        const embed = document.querySelector('#embed');

        if (embedder !== null)
            embedder.setAttribute('visibility', 'false');

        if (embed !== null)
            embed.innerHTML = '';
    };

    const updatePrefixRow = (type, prefixId, formObject) => {
        const editModal = document.getElementById('edit-' + prefixId);
        const deleteModal = document.getElementById('delete-' + prefixId);
        const prefixRow = editModal !== null ? editModal.previousElementSibling : null;

        if (type === 'delete') {
            if (prefixRow !== null)
                prefixRow.remove();

            if (editModal !== null)
                editModal.remove();

            if (deleteModal !== null)
                deleteModal.remove();

            return;
        }

        const prefixName = (formObject.prefixname || '').trim();
        const prefixClass = (formObject.prefixclass || '').trim();

        if (prefixRow !== null) {
            const nameElement = prefixRow.querySelector('.prefix_name');
            const classElement = prefixRow.querySelector('.prefix_class');

            if (nameElement !== null)
                nameElement.textContent = prefixName;

            if (classElement !== null)
                classElement.textContent = prefixClass;
        }

        if (editModal !== null) {
            const nameInput = editModal.querySelector('input[name="prefixname"]');
            const classInput = editModal.querySelector('input[name="prefixclass"]');

            if (nameInput !== null)
                nameInput.value = prefixName;

            if (classInput !== null)
                classInput.value = prefixClass;
        }

        if (deleteModal !== null) {
            const question = deleteModal.querySelector('p');

            if (question !== null)
                question.textContent = 'Do you want to delete prefix "' + prefixName + '"?';
        }
    };

    const createPrefixForm = document.getElementById('prefixCreateForm');

    if (createPrefixForm !== null) {
        createPrefixForm.addEventListener('submit', event => {
            event.preventDefault();

            const submit = createPrefixForm.querySelector('button[type="submit"]');
            const formData = new FormData(createPrefixForm);
            const payload = {
                type: 'create',
                prefixname: (formData.get('prefixname') || '').toString().trim(),
                prefixclass: (formData.get('prefixclass') || '').toString().trim(),
                csrf_token: (formData.get('csrf_token') || '').toString()
            };

            if (payload.prefixname === '' || payload.prefixclass === '') {
                toast('Name and CSS class are required.');
                return;
            }

            if (submit !== null)
                submit.disabled = true;

            const reset = () => {
                if (submit !== null)
                    submit.disabled = false;
            };

            req('POST', '{server_url}api/prefixes', JSON.stringify(payload), (msg, data) => {
                if (msg !== null) {
                    toast(msg);
                    reset();
                    return;
                }

                if (data === null) {
                    toast('Data is null');
                    reset();
                    return;
                }

                try {
                    const response = JSON.parse(data);

                    if (response === null || response.data === null || !response.data.message) {
                        toast('Invalid API response');
                        reset();
                        return;
                    }

                    toast(response.data.message, 5, '53, 255, 53');
                    setTimeout(() => window.location.reload(), 700);
                } catch (error) {
                    toast('Error parsing JSON data: ' + error.message);
                    reset();
                }
            });
        });
    }

    // The modal is cloned by main.js when it is displayed, so listeners attached to the
    // original hidden modal would be lost. Delegate from the document instead.
    document.addEventListener('click', event => {
        const button = event.target.closest('#embed .modal button[type="submit"]');

        if (button === null)
            return;

        const modal = button.closest('.modal');
        const form = modal !== null ? modal.querySelector('form') : null;

        if (form === null)
            return;

        event.preventDefault();

        const formData = new FormData(form);
        const formObject = {};

        formData.forEach((value, key) => {
            formObject[key] = value;
        });

        const type = formObject.type;
        const prefixId = formObject.prefixid;

        if ((type !== 'edit' && type !== 'delete') || !/^\d+$/.test(prefixId)) {
            toast('Invalid prefix data.');
            return;
        }

        const uri = '{server_url}api/prefixes/' + type + '/' + prefixId;

        req('POST', uri, JSON.stringify(formObject), (msg, data) => {
            if (msg !== null) {
                toast(msg);
                return;
            }

            if (data === null) {
                toast('Data is null');
                return;
            }

            try {
                const response = JSON.parse(data);

                if (response === null || response.data === null || !response.data.message) {
                    toast('Invalid API response');
                    return;
                }

                toast(response.data.message, 5, '53, 255, 53');
                updatePrefixRow(type, prefixId, formObject);
                closeEmbed();
            } catch (error) {
                toast('Error parsing JSON data: ' + error.message);
            }
        });
    });
</script>
