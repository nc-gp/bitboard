<article class="admin-theme-card{active_class}">
    <div class="admin-theme-shot">{screenshot}</div>

    <div class="admin-theme-info">
        <div class="admin-theme-title">
            <strong>{name}</strong>
            <span class="admin-theme-badges">{badges}</span>
        </div>
        <p class="admin-theme-desc">{desc}</p>
        <p class="admin-theme-meta">{meta}</p>
        {error}
    </div>

    <div class="admin-theme-actions">
        {actions}
    </div>
</article>
