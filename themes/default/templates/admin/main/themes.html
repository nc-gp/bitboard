<article class="admin-themes">
    <header class="admin-section-header">
        <span class="admin-section-icon"><i class="ti ti-palette" aria-hidden="true"></i></span>
        <div>
            <h2>Themes</h2>
            <p>Install, preview, activate, or remove public themes. The admin panel always uses the default theme.</p>
        </div>
    </header>

    <section class="admin-theme-install">
        <h3>Install a theme</h3>
        {install_form}
    </section>

    <section class="admin-theme-install">
        <h3>Create from default</h3>
        {create_form}
    </section>

    <div class="admin-themes-grid">
        {themes}
    </div>
</article>
