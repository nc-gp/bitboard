<form action="{server_url}edit" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{csrf_token}">
    <input type="hidden" name="type" value="{type}">
    <input type="hidden" name="id" value="{id}">
    <input type="hidden" name="action" value="save">

    {title_field}
    {prefix_field}

    <label for="edit-content">Message</label>
    <div class="bb-editor" data-editor data-draft-key="{draft_key}" data-preview-url="{server_url}preview">
        {editor_toolbar}
        <textarea id="edit-content" name="content" maxlength="4000" required>{content}</textarea>
    </div>
    <p class="post-hint">
        Markdown is supported: <strong>**bold**</strong>, <em>*italic*</em>, <code>`code`</code>,
        <code>&gt;</code> quotes, lists, links, and images. Raw HTML is shown as text.
        Use <code>@username</code> to mention a member.
    </p>

    {existing_attachments}
    {attachments_field}

    <div class="post-actions">
        <button type="submit">Save changes</button>
        <a href="{cancel_url}" class="post-cancel">Cancel</a>
    </div>
</form>
