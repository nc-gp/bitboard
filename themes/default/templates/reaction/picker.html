<div class="reaction-picker">
    <button type="button" class="reaction-trigger {trigger_class}"
        aria-haspopup="true" aria-expanded="false" aria-label="Choose a reaction">
        <i class="ti {trigger_icon}" aria-hidden="true"></i>
        <span class="reaction-total">{count}</span>
    </button>

    {form}
</div>
