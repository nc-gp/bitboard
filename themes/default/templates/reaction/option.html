<button type="submit" name="reaction" value="{reaction}"
    class="reaction-option reaction-{reaction} {active_class}"
    data-icon="{icon}" aria-pressed="{pressed}">
    <i class="ti {icon}" aria-hidden="true"></i>
    <span class="reaction-label">{label}</span>
    <span class="reaction-count">{count}</span>
</button>
