<a class="online-user" href="{server_url}profile/{id}">
    <span class="online-user-avatar"><img src="{avatar}" alt="{username_plain}'s avatar"></span>
    <span class="online-user-details">
        <span class="online-user-name">{username}</span>
        <span class="online-user-rank">{rank}</span>
        <span class="online-user-lastseen"><i class="ti ti-clock"></i> Active {last_seen}</span>
    </span>
</a>
