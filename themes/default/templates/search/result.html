<div class="search-result">
    <div class="search-result-icon"><i class="ti {icon}" aria-hidden="true"></i></div>
    <div class="search-result-body">
        <div class="search-result-kicker">
            <span class="search-result-type">{type_label}</span>
            <span class="search-result-location">{location}</span>
        </div>
        <a class="search-result-title" href="{url}">{title}</a>
        <p class="search-result-excerpt">{excerpt}</p>
        <div class="search-result-meta">
            <span>by {author}</span>
            <span>{date}</span>
        </div>
    </div>
</div>
