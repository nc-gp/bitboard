<div class="bb-editor-toolbar" role="toolbar" aria-label="Formatting">
    <button type="button" class="bb-editor-button" data-editor-action="bold" title="Bold (Ctrl+B)" aria-label="Bold">
        <i class="ti ti-bold" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="italic" title="Italic (Ctrl+I)" aria-label="Italic">
        <i class="ti ti-italic" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="strike" title="Strikethrough" aria-label="Strikethrough">
        <i class="ti ti-strikethrough" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="heading" title="Heading" aria-label="Heading">
        <i class="ti ti-h-2" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="quote" title="Quote" aria-label="Quote">
        <i class="ti ti-blockquote" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="code" title="Inline code" aria-label="Inline code">
        <i class="ti ti-code" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="link" title="Link (Ctrl+K)" aria-label="Link">
        <i class="ti ti-link" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="list" title="Bulleted list" aria-label="Bulleted list">
        <i class="ti ti-list" aria-hidden="true"></i>
    </button>
    <button type="button" class="bb-editor-button" data-editor-action="ordered" title="Numbered list" aria-label="Numbered list">
        <i class="ti ti-list-numbers" aria-hidden="true"></i>
    </button>

    <span class="bb-editor-spacer"></span>
    <span class="bb-editor-status" aria-live="polite"></span>

    <button type="button" class="bb-editor-button bb-editor-preview-toggle" data-editor-action="preview"
        title="Show preview" aria-label="Show preview" aria-pressed="false">
        <i class="ti ti-eye" aria-hidden="true"></i>
    </button>
</div>

<div class="bb-editor-draft" hidden>
    <i class="ti ti-device-floppy" aria-hidden="true"></i>
    <span class="bb-editor-draft-text">Draft available.</span>
    <button type="button" class="bb-editor-button" data-editor-draft="restore">Restore</button>
    <button type="button" class="bb-editor-button" data-editor-draft="discard">Discard</button>
</div>

<div class="bb-editor-preview" hidden aria-live="polite"></div>
