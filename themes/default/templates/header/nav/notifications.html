<div class="notification-center" data-notifications-url="{server_url}notifications">
    <button type="button" class="notification-bell" aria-label="{label}" aria-haspopup="true" aria-expanded="false">
        <i class="ti ti-bell" aria-hidden="true"></i>
        <span class="notification-badge"{badge_hidden}>{badge_count}</span>
    </button>

    <div class="notification-panel" hidden>
        <div class="notification-panel-header">
            <div class="notification-panel-title">
                <i class="ti ti-bell" aria-hidden="true"></i>
                <strong>Notifications</strong>
                <span class="notification-panel-count" hidden></span>
            </div>
            <div class="notification-panel-actions">
                <button type="button" class="notification-sound-toggle" aria-label="Notification sounds"
                    aria-pressed="true" data-tooltip-position="bottom" role="tooltip">
                    <i class="ti ti-volume" aria-hidden="true"></i>
                </button>
                <button type="button" class="notification-mark-all" hidden>Mark all as read</button>
            </div>
        </div>
        <div class="notification-panel-list">
            <div class="notification-panel-empty">
                <i class="ti ti-bell-off" aria-hidden="true"></i>
                <strong>You're all caught up</strong>
                <span>New mentions and reactions will appear here.</span>
            </div>
        </div>
    </div>
</div>
