<div class="login_register">
    <a class="nav-icon-link" href="{server_url}login" aria-label="Login">
        <i class="ti ti-login-2" aria-hidden="true"></i>
    </a>
    <a class="nav-icon-link" href="{server_url}register" aria-label="Register">
        <i class="ti ti-user-plus" aria-hidden="true"></i>
    </a>
    <div class="nav-drop">
        <button aria-haspopup="true" aria-label="Theme switcher" data-tooltip-position="top-left">
            <i class="ti ti-sun-moon" aria-hidden="true"></i>
        </button>
        <ul>
            <li>
                <a href="#" data-theme-switcher="auto" aria-label="Use automatic color scheme">
                    <i class="ti ti-circle-letter-a" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a href="#" data-theme-switcher="light" aria-label="Use light color scheme">
                    <i class="ti ti-sun" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a href="#" data-theme-switcher="dark" aria-label="Use dark color scheme">
                    <i class="ti ti-moon-stars" aria-hidden="true"></i>
                </a>
            </li>
        </ul>
    </div>
</div>
