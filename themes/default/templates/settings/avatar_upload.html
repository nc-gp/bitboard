<div class="settings-avatar-upload-row">
    <input id="settings-avatar" class="settings-avatar-input" type="file" name="avatar"
        accept="{accept}" aria-label="Upload a new avatar">
    <label class="settings-avatar-upload" for="settings-avatar">
        <i class="ti ti-upload" aria-hidden="true"></i> Choose image
    </label>
    <span id="settings-avatar-filename" class="settings-avatar-filename">No file selected</span>
</div>
<p class="settings-hint">{hint}</p>
