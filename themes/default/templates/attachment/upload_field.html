<div class="attachment-upload">
    <label for="{id}">
        <span>Attachments</span>
        <input id="{id}" type="file" name="attachments[]" accept="{accept}" aria-label="Attachments" multiple>
    </label>
    <p class="attachment-hint">
        Up to {max_files} files, {max_size} each. Allowed: {extensions}.
    </p>
</div>
